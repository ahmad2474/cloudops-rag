[project]
name = "cloudops-rag"
version = "0.1.0"
description = "CloudOps Knowledge Assistant — production-grade RAG for Cloud/Platform Engineering"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "structlog>=24.4",
  "httpx>=0.27",
  "opensearch-py>=2.7",
  "pyyaml>=6.0.3",
  "beautifulsoup4>=4.15.0",
  "markdownify>=1.2.3",
  "tiktoken>=0.14.0",
  "boto3>=1.35.49",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "checkov>=3.2",
  "types-pyyaml>=6.0.12.20260906",
  "boto3-stubs[bedrock-runtime]>=1.43.93",
  "types-beautifulsoup4>=4.12.0.20250516",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudops_rag", "apps/api/app"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "apps/api", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "N",        # pep8-naming
  "S",        # bandit
  "ASYNC",    # async pitfalls
  "RUF",
]
ignore = ["S101"]  # assert in tests is fine

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"apps/api/tests/**" = ["S", "B"]
"apps/evaluation/build_dataset.py" = ["E501"]  # one question per line, by design

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src:apps/api"
packages = ["cloudops_rag", "app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["opensearchpy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests", "apps/api/tests"]
pythonpath = ["src", "apps/api"]
asyncio_mode = "auto"
markers = [
  "integration: requires running Docker services (OpenSearch)",
]
addopts = "-ra -q --import-mode=importlib"
filterwarnings = ["error::DeprecationWarning:cloudops_rag.*"]
