name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python — ruff / mypy / pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not integration" --cov=cloudops_rag --cov=app --cov-report=term-missing
      - name: corpus manifest up to date
        run: uv run python apps/ingestion/build_manifest.py --check

  python-integration:
    name: Python — integration (OpenSearch)
    runs-on: ubuntu-latest
    services:
      opensearch:
        image: opensearchproject/opensearch:2.19.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run pytest -m integration
        env:
          OPENSEARCH_URL: http://localhost:9200

  web:
    name: Web — lint / typecheck / build / playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test

  infra:
    name: Infra — terraform / tflint / trivy / hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: terraform fmt / validate
        working-directory: infrastructure/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        working-directory: infrastructure/terraform
        run: |
          tflint --init
          tflint --recursive
      - name: trivy config (HIGH/CRITICAL; accepted findings in infrastructure/terraform/.trivyignore)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: infrastructure/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: infrastructure/terraform/.trivyignore
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/api.Dockerfile
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/web.Dockerfile

  security:
    name: Security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      # Phase 7 populates tests/security and tests/adversarial. Until then this passes on "no tests".
      - run: uv run pytest tests/security tests/adversarial -m "not integration" || [ $? -eq 5 ]
